services:
  - type: web
    name: gdl-web
    runtime: docker
    healthCheckPath: /health
    disk:
      name: gdl-storage
      mountPath: /app/storage
      sizeGB: 10
    envVars:
      - key: APP_ENV
        value: production
      - key: STORAGE_DIR
        value: /app/storage
      - key: SECRET_KEY
        generateValue: true
      - key: COOKIES_ENCRYPTION_KEY
        sync: false
      - key: ENABLE_RUNTIME_UPDATES
        value: "false"
      - key: LOG_LEVEL
        value: INFO
      - key: MAX_CONCURRENT_DOWNLOADS_GLOBAL
        value: "6"
      - key: MAX_CONCURRENT_DOWNLOADS_PER_SESSION
        value: "2"
      - key: MAX_FILESIZE_MB
        value: "500"
      - key: DOWNLOAD_TTL_SECONDS
        value: "3600"
